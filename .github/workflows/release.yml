# Release packages: on a v* tag, build macOS, Windows and Linux (x64 + arm64) packages
# and attach them to a DRAFT GitHub release. Publishing stays a manual click (#1596,
# and Marc's standing decision).
#
# WHAT A TAG PRODUCES
#   macOS   excise-<v>-macos-arm64.zip          (Native AOT, ad-hoc signed .app)
#   Windows excise-<v>-win-x64-setup.exe        (Inno Setup installer, Native AOT) + portable .zip (same payload)
#   Linux   excise_<v>_amd64.deb + .tar.gz      (Native AOT, built on x64)
#           excise_<v>_arm64.deb + .tar.gz      (Native AOT, built on arm64)
#   plus a .sha256 per asset and one SHA256SUMS, checked against the downloaded files
#   before anything is attached.
#
# EVERY PACKAGE IS NATIVE AOT, AND EVERY JOB FAILS IF ITS PACKAGE IS NOT (owner
#   requirement). All four legs publish with the same flags
#   (-p:PublishAot=true -p:PublishReadyToRun=false -p:PublishSingleFile=false
#   -p:EnableScripting=false -p:IncludeTessdataInApp=false). A publish can fall back
#   to an ordinary self-contained or single-file build and still start, so each job
#   unpacks what it is about to ship (the .deb, the tarball, the zip, the installed
#   tree) and runs scripts/check-aot-payload.py on it: no managed assembly (a PE
#   file with a CLI header, judged by bytes, not by a *.dll count, because the
#   Windows payload legitimately carries native .dll files), no runtime files, and
#   no single-file bundle marker in the main executables. The script's --self-test
#   runs first in every job, so the check has been seen to fail before it is trusted.
#   The Windows job also LAUNCHES the installed app and CLI: the GUI scenario
#   runner reports whether the running process is AOT (runtimeMode).
#
# UNSIGNED, BY CHOICE (#1597, #1698 is the open re-decision). No signing, no
# notarization, no auto-update. macOS shows a Gatekeeper prompt and Windows a
# SmartScreen warning on first run, and the release notes say so.
#
# HOW IT WAS ASSEMBLED, AND WHAT IS AND IS NOT VERIFIED
#   Reused from the release workflow deleted with Actions (eeff1aa7) minus the
#   rendering gate and coverage-floor jobs, which are what made that CI red and
#   ignored (#1355). The Linux legs were verified natively on hosted x64 and arm64
#   runners (run 35550350097: publish + launch + scenario, AOT included), but only for
#   the GUI publish. A dispatch on develop built all four legs green (run
#   35555517990) BEFORE the Windows leg became Native AOT; the AOT Windows package,
#   its payload check and its launch smoke have not run in this workflow yet, and
#   workflow_dispatch is inert off the default branch, so the first real exercise is
#   a dispatch after this lands. windows.yml's advisory windows-aot job has published
#   the GUI with Native AOT on 8 consecutive develop runs (latest 35562489812), but
#   never launched the result, and the Windows CLI has never been AOT-published.
#   Each job ends with a check that the package is what it claims (a .deb is
#   installed and run, the Windows installer is installed silently and launched, the
#   macOS bundle is inspected), so a broken package fails the job rather than the
#   download.
#
# TRIGGERS
#   push of a v* tag      builds everything and creates/updates the DRAFT release.
#   workflow_dispatch     DRY RUN: builds everything for the version in the tree and
#                         uploads run artifacts. It never touches a release. It needs
#                         no tag, so use it before tagging.
#
# Not a gate. macos.yml (develop advisory) and linux.yml/windows.yml are unaffected;
# macos.yml's old tag-only job moved here so a tag does not build macOS twice.
name: Release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the v (must equal the version in the tree). Dry run: nothing is released.'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NUGET_SIGNATURE_VERIFICATION: false
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  preflight:
    name: Preflight (version, changelog, docs, licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve the version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then v="${INPUT_VERSION#v}"; else v="${GITHUB_REF_NAME#v}"; fi
          [ -n "$v" ] || { echo "no version resolved"; exit 1; }
          case "$v" in *-rc*|*-beta*|*-alpha*) pre=true ;; *) pre=false ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "version: $v (prerelease=$pre)"

      # #1627: a tagged build stamps the assemblies from the TREE, so a tag that
      # disagrees ships a binary whose About window names a different release.
      # Checked before any build so the failure is one line, not a bad artifact.
      - name: The version names what the tree declares
        run: scripts/check-version-consistency.sh --tag "v${{ steps.ver.outputs.version }}"

      - name: The changelog has notes for this version
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          n=$(awk -v v="$v" '$0 ~ "^## \\[" v "\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md | grep -c '[^[:space:]]' || true)
          echo "changelog lines for $v: $n"
          test "$n" -gt 0 || { echo "CHANGELOG.md has no section for [$v]"; exit 1; }

      - name: Documentation claims are current
        run: scripts/check-doc-claim-freshness.sh

      # VERIFY, do not regenerate (#1082): the attribution users see must be the
      # attribution that was reviewed, not whatever the NuGet cache produced today.
      - name: The license manifest matches the dependencies
        run: scripts/verify-license-manifest.sh

  linux:
    name: Linux ${{ matrix.arch }} (.deb + .tar.gz)
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, rid: linux-x64,   runner: ubuntu-latest }
          - { arch: arm64, rid: linux-arm64, runner: ubuntu-24.04-arm }
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      ARCH: ${{ matrix.arch }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Native AOT on Linux shells out to clang and needs zlib headers; without them
      # `dotnet publish -p:PublishAot=true` fails inside the linker with a message
      # that does not name the missing package. AOT cannot cross-compile, which is why
      # each architecture builds on a runner of its own.
      - name: Install the Native AOT prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Build the .deb (Native AOT)
        run: ./scripts/build-deb.sh --version "$VERSION" --arch "$ARCH" --aot --output dist/

      # AOT's failure modes are runtime-only (trimmed reflection, native asset
      # loading), so a successful publish proves little. The CLI needs no display and
      # `render` exercises SkiaSharp's native load and the font stack, which the GUI
      # shares. This does NOT verify the GUI on Linux; that gap is real.
      - name: Smoke the AOT CLI binary
        run: |
          set -euo pipefail
          cli="artifacts/publish/$RID/cli/excise"
          test -x "$cli" || { echo "AOT CLI binary missing at $cli"; exit 1; }
          file -b "$cli"
          # No managed sidecars is the signature of a real AOT publish; a silent
          # fallback to the ordinary self-contained build would still pass --version.
          dlls=$(find "artifacts/publish/$RID/cli" -maxdepth 1 -name '*.dll' | wc -l)
          echo "managed dll sidecars: $dlls (expect 0)"
          test "$dlls" -eq 0 || { echo "not an AOT publish"; exit 1; }
          "$cli" --version
          # A COMMITTED fixture: test-pdfs/ is gitignored, and pointing this at the
          # corpus would degrade to "no PDF found" while the step still passed.
          pdf="Excise.App.Tests/Resources/sample-pdfs/birth-certificate-request-scrambled.pdf"
          test -f "$pdf" || { echo "smoke fixture missing: $pdf"; exit 1; }
          "$cli" info "$pdf"
          "$cli" render "$pdf" -o /tmp/aot-smoke.png --dpi 72 --ignore-permissions
          bytes=$(stat -c%s /tmp/aot-smoke.png)
          echo "rendered -> $bytes bytes"
          test "$bytes" -gt 5000 || { echo "render produced a trivial file"; exit 1; }

      # The package is what users get, so install IT: dependency resolution, file
      # layout and the /usr/bin symlink are all things the publish smoke cannot see.
      - name: Install the .deb and run the installed CLI
        run: |
          set -euo pipefail
          deb=$(ls dist/excise_*_"$ARCH".deb)
          echo "package: $deb"
          dpkg-deb --info "$deb" | grep -E "Package:|Version:|Architecture:"
          test "$(dpkg-deb --field "$deb" Architecture)" = "$ARCH" || { echo "wrong Architecture field"; exit 1; }
          sudo apt-get install -y "./$deb"
          command -v excise
          excise --version

      - name: Build the portable tarball
        run: |
          set -euo pipefail
          src="artifacts/publish/$RID"
          out="dist/excise-$VERSION-linux-${ARCH/amd64/x64}.tar.gz"
          mkdir -p stage/excise
          cp -a "$src/gui/." stage/excise/
          cp -a "$src/cli/." stage/excise/
          cp README.md LICENSE LICENSES.md stage/excise/ 2>/dev/null || true
          tar -C stage -czf "$out" excise
          ls -lh "$out"

      # The shipped bytes, not the publish directory: unpack what the .deb and the
      # tarball contain, and check the tree the .deb installed above.
      - name: Prove the packages are Native AOT
        run: |
          set -euo pipefail
          python3 scripts/check-aot-payload.py --self-test
          deb=$(ls dist/excise_*_"$ARCH".deb)
          tarball=$(ls dist/excise-*-linux-*.tar.gz)
          x=$(mktemp -d)
          dpkg-deb -x "$deb" "$x/deb"
          mkdir "$x/tar"
          tar -C "$x/tar" -xzf "$tarball"
          python3 scripts/check-aot-payload.py --main Excise.App --main excise "$x/deb/usr/lib/excise"
          python3 scripts/check-aot-payload.py --main Excise.App --main excise "$x/tar/excise"
          python3 scripts/check-aot-payload.py --main Excise.App --main excise /usr/lib/excise

      - name: Checksums
        working-directory: dist
        run: |
          for f in *.deb *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: Windows x64 (installer + portable zip)
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # Native AOT, like the other three legs (the script carries the flags). AOT needs
      # the MSVC toolchain, which windows-latest already has, and took 3-5 minutes in
      # windows.yml's windows-aot job. The script moves native symbols out of the
      # publish directory so they are not packed.
      - name: Build the installer (Native AOT)
        shell: pwsh
        run: pwsh ./scripts/build-windows-installer.ps1 -Version "$env:VERSION" -OutputDir dist

      - name: Build the portable zip
        shell: pwsh
        run: |
          $src = "artifacts\publish\win-x64\gui"
          New-Item -ItemType Directory -Force -Path "stage\excise" | Out-Null
          Copy-Item "$src\*" "stage\excise" -Recurse -Force
          Copy-Item README.md, LICENSE, LICENSES.md "stage\excise" -ErrorAction SilentlyContinue
          $zip = "dist\excise-$env:VERSION-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path stage\excise -DestinationPath $zip

      # A silent install is the cheapest proof the installer is an installer: the
      # wizard, the file layout and the uninstaller registration all have to work.
      - name: Install the installer silently and check the payload
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1)
          if (-not $exe) { throw "no installer .exe in dist" }
          $dir = Join-Path $env:RUNNER_TEMP "excise-install"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          $app = Join-Path $dir "Excise.App.exe"
          if (-not (Test-Path $app)) { Get-ChildItem $dir | Format-Table; throw "installed payload has no Excise.App.exe" }
          Write-Host "installed: $app ($((Get-Item $app).Length) bytes)"

      - name: Unpack the portable zip
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\*.zip | Select-Object -First 1)
          if (-not $zip) { throw "no portable zip in dist" }
          Expand-Archive -Path $zip.FullName -DestinationPath (Join-Path $env:RUNNER_TEMP "excise-zip") -Force

      # The publish directory, the unpacked portable zip and the installed tree are
      # the same files three ways, and each is checked: the first names where a
      # fallback happened, the other two are what users get. `python` before
      # `python3`: on a Windows runner python3 can be the Microsoft Store stub.
      - name: Prove the shipped payload is Native AOT
        shell: bash
        run: |
          set -euo pipefail
          py=$(command -v python || command -v python3)
          "$py" scripts/check-aot-payload.py --self-test
          for d in artifacts/publish/win-x64/gui "$RUNNER_TEMP/excise-zip/excise" "$RUNNER_TEMP/excise-install"; do
            "$py" scripts/check-aot-payload.py --main Excise.App.exe --main excise.exe "$d"
          done

      # The static check reads bytes; this asks the RUNNING process. The installed CLI
      # renders a committed PDF (SkiaSharp's native load and the font stack), and the
      # installed GUI runs the perf-scenario runner (the `null` scenario windows.yml
      # smokes on its Debug build), whose result file states whether the process is
      # JIT or AOT. Neither Windows AOT binary had been launched anywhere before this
      # step. Blocking, not continue-on-error: a smoke that cannot fail is not a smoke
      # (#1527).
      - name: Smoke the installed Native AOT CLI and GUI
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "excise-install"
          $out = "artifacts/aot-smoke"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $pdf = "Excise.App.Tests/Resources/sample-pdfs/birth-certificate-request-scrambled.pdf"
          if (-not (Test-Path $pdf)) { throw "smoke fixture missing: $pdf" }

          $cli = Join-Path $dir "excise.exe"
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "the installed AOT CLI did not run" }
          & $cli info $pdf | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "the installed AOT CLI could not read the fixture" }
          & $cli render $pdf -o "$out/page1.png" --dpi 72 --ignore-permissions
          if ($LASTEXITCODE -ne 0) { throw "the installed AOT CLI could not render" }
          $png = (Get-Item "$out/page1.png").Length
          Write-Host "rendered -> $png bytes"
          if ($png -le 5000) { throw "the render produced a trivial file" }

          $env:EXCISE_PERF_SCENARIO = "tests/gui-perf-scenarios.json"
          $env:EXCISE_PERF_SCENARIO_ID = "null"
          $env:EXCISE_PERF_SCENARIO_OUT = $out
          $env:EXCISE_PERF_SCENARIO_SAMPLE_MS = "250"
          $exe = Join-Path $dir "Excise.App.exe"
          $p = Start-Process -FilePath $exe -ArgumentList $pdf -PassThru `
                 -RedirectStandardOutput "$out/app.out.log" `
                 -RedirectStandardError  "$out/app.err.log"
          if (-not $p.WaitForExit(180000)) {
            $p.Kill(); throw "the installed app did not quit within 180s; the scenario runner shuts it down itself"
          }
          Get-Content "$out/app.out.log","$out/app.err.log" -ErrorAction SilentlyContinue
          $resultFile = Join-Path $out "scenario-result.json"
          if (-not (Test-Path $resultFile)) {
            throw "no scenario-result.json: the app died before the runner finished (exit $($p.ExitCode))"
          }
          $r = Get-Content $resultFile -Raw | ConvertFrom-Json
          Write-Host "scenario=$($r.scenario) steps=$($r.steps) failures=$($r.failures) runtimeMode=$($r.configuration.runtimeMode)"
          if ($r.configuration.runtimeMode -ne "aot") { throw "the installed app reports runtimeMode=$($r.configuration.runtimeMode), not aot" }
          if ($r.steps -lt 1)    { throw "the scenario ran no steps" }
          if ($r.failures -ne 0) { throw "$($r.failures) scenario step(s) failed" }
          if ($p.ExitCode -ne 0) { throw "the app exited $($p.ExitCode) after a clean scenario" }

      - name: Checksums
        shell: pwsh
        run: |
          # LF, not Out-File: `Out-File -Encoding ascii` writes CRLF, which makes
          # `sha256sum -c` read the filename as "name\r" and fail, both in the release
          # job below and for a Linux user verifying the attached .sha256 file.
          Get-ChildItem dist\* -Include *.exe,*.zip | ForEach-Object {
            $sha = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            [System.IO.File]::WriteAllText("$($_.FullName).sha256", "$sha  $($_.Name)`n", [System.Text.Encoding]::ASCII)
          }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.exe.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  macos:
    name: macOS arm64 (.app zip)
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install librsvg (for the .icns icon; best effort)
        continue-on-error: true
        run: brew install librsvg

      # --aot: what the checklist's support matrix says osx-arm64 ships, and what
      # v3.10.0 actually attached (26 MB; a non-AOT bundle is ~69 MB zipped). It is
      # 55 MB against 175 MB unpacked. Native AOT cannot cross-compile, which is why
      # macOS builds here on macos-latest.
      - name: Build the .app (arm64, Native AOT)
        run: scripts/build-macos-app.sh --version "$VERSION" --rid osx-arm64 --aot --output dist

      - name: The built app is the tagged version, signed and self-contained
        # A zip that unpacks is not a build that shipped correctly. This step does
        # NOT launch the app, and the reason it once gave was wrong: a hosted
        # macos-latest runner DOES have a window server (measured 2026-09-20,
        # #1724, #1595: WindowServer, managername Aqua, a non-black screencapture,
        # the published GUI ran perf scenarios with no -6661). What is untested is
        # launching the BUNDLE: those runs used the bare publish binary, so how
        # Gatekeeper and quarantine treat the ad-hoc-signed .app on a runner is
        # unknown. So this checks the version, the ad-hoc signature (#635) and the
        # native components that must travel with it.
        run: |
          set -euo pipefail
          plutil -p "dist/excise.app/Contents/Info.plist" | grep -F "$VERSION"
          codesign -dv "dist/excise.app" 2>&1 | grep -F 'Signature=adhoc'
          test -x "dist/excise.app/Contents/MacOS/Excise.App"
          for lib in libSkiaSharp.dylib libHarfBuzzSharp.dylib libAvaloniaNative.dylib; do
            test -f "dist/excise.app/Contents/MacOS/$lib" || { echo "missing native component: $lib"; exit 1; }
          done

      # The shipped bytes: unpack the zip that is about to be attached and check it.
      # macOS ships the GUI only, so one executable is required.
      - name: Prove the shipped bundle is Native AOT
        run: |
          set -euo pipefail
          python3 scripts/check-aot-payload.py --self-test
          x=$(mktemp -d)
          ditto -x -k "dist/excise-${VERSION}-macos-arm64.zip" "$x"
          python3 scripts/check-aot-payload.py --main Excise.App "$x/excise.app"

      # #1389: a different SDK produced a binary that wrote different PDF bytes. The
      # zip is not byte-reproducible (timestamps), so this records the checksum as
      # evidence for comparison with a local build rather than asserting equality.
      - name: Record the checksum for comparison with the local build
        run: shasum -a 256 dist/excise-*-macos-*.zip | tee dist/ci-build.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            dist/excise-*-macos-*.zip
            dist/excise-*-macos-*.zip.sha256
            dist/ci-build.sha256
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: [preflight, linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only a real tag creates a release. A dispatch is a dry run.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.preflight.outputs.version }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Gather the assets and check them against their checksums
        run: |
          set -euo pipefail
          mkdir -p assets
          # ci-build.sha256 is comparison evidence, not a release asset.
          find artifacts -type f ! -name ci-build.sha256 -exec cp {} assets/ \;
          cd assets
          ls -la
          # One SHA256SUMS from the per-asset files, then verify every downloaded
          # asset against it, so a truncated or mixed-up upload fails HERE and not on
          # a user's machine.
          cat ./*.sha256 | tr -d '\r' | sort -k2 > SHA256SUMS   # tr: defensive against CRLF from any producer
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "assets: $(find . -maxdepth 1 -type f ! -name '*.sha256' | wc -l | tr -d ' ')"

      - name: Expect exactly the packages this release promises
        run: |
          set -euo pipefail
          cd assets
          # Globs, not exact names: build-deb.sh writes an -rc version as ~rc in the
          # package file name, so an exact match would fail on every rc tag.
          for pat in 'excise_*_amd64.deb' 'excise_*_arm64.deb' 'excise-*-macos-arm64.zip' 'excise-*-win-x64.zip' 'excise-*.exe' 'excise-*-linux-x64.tar.gz' 'excise-*-linux-arm64.tar.gz'; do
            compgen -G "$pat" >/dev/null || { echo "MISSING expected asset: $pat"; ls; exit 1; }
          done

      - name: Release notes from the changelog
        run: |
          set -euo pipefail
          {
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md
            cat <<'EOF'

          ---

          ### Installing

          | Platform | Asset |
          |---|---|
          | macOS (Apple Silicon) | `excise-<version>-macos-arm64.zip`: unzip, move `excise.app` to Applications |
          | Windows 10/11 (x64) | `excise-<version>-win-x64-setup.exe`, or the portable `.zip` |
          | Ubuntu / Debian (x64) | `excise_<version>_amd64.deb`: `sudo apt install ./excise_<version>_amd64.deb` |
          | Ubuntu / Debian (arm64) | `excise_<version>_arm64.deb` |

          Portable `.tar.gz` archives are attached for Linux. Every asset has a `.sha256`, and `SHA256SUMS` covers all of them.

          **These builds are unsigned.** macOS will show a Gatekeeper prompt (right-click, Open, or `xattr -dr com.apple.quarantine excise.app`) and Windows SmartScreen will warn on first run. There is no auto-update. Linux printing is not implemented.
          EOF
          } > notes.md
          test "$(grep -c '[^[:space:]]' notes.md)" -gt 12 || { echo "release notes are suspiciously short"; exit 1; }
          # GitHub rejects a release body over 125,000 characters, and that would fail
          # here at the LAST step, after every package built. v3.10.0's changelog
          # section alone is 86,000 bytes (the body its human editor published was
          # 6,600). So cap it, at a line boundary, and say so. The release is a draft:
          # someone reads and trims it before publishing anyway.
          if [ "$(wc -c < notes.md)" -gt 100000 ]; then
            head -c 100000 notes.md | sed '$d' > notes.cut
            printf '\n\n> Release notes truncated to fit GitHub'"'"'s 125,000-character limit. The full text is in CHANGELOG.md at this tag.\n' >> notes.cut
            mv notes.cut notes.md
            echo "notes truncated to $(wc -c < notes.md) bytes"
          fi
          wc -lc notes.md

      # `gh` rather than a third-party action: one fewer dependency in the release
      # path. --draft is explicit: publishing stays a manual click.
      - name: Create the DRAFT release (or add to one that already exists)
        run: |
          set -euo pipefail
          files=(assets/*)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; uploading assets to it"
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            flags=(--draft --verify-tag --title "excise $TAG" --notes-file notes.md)
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            gh release create "$TAG" "${files[@]}" "${flags[@]}"
          fi
          gh release view "$TAG" --json isDraft,assets --jq '{draft: .isDraft, assets: [.assets[].name]}'
