name: Build and release

# Triggers:
#   • A v* tag push  → automatic release (typical CLI release flow)
#   • A GitHub Release published manually → attach installers
#   • workflow_dispatch → manual rerun against an existing tag
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.1.0-rc8); only used for workflow_dispatch'
        required: true
        default: '2.1.0-rc8'

env:
  DOTNET_VERSION: '10.0.x'
  # ReactiveUI/Splat's author signing certificate was revoked upstream, so a
  # cold `dotnet restore` fails with NU3012 (revoked cert). ci.yml already sets
  # this; release.yml didn't, so a version-bump cache miss surfaced it as a
  # silent restore failure in the license-manifest step (#387). Match ci.yml.
  DOTNET_NUGET_SIGNATURE_VERIFICATION: false

# Lets the release job push installers as release assets.
permissions:
  contents: write

jobs:
  # ── 0. Release gate: run the rendering Differential + Corpus tests against
  #       independent oracles (mutool/gs/pdftocairo) on Linux. `publish`
  #       depends on this, so a tag cannot ship installers if excise's
  #       renderer/extractor has regressed against a non-excise reference.
  #       Same reusable job ci.yml runs on every push. ─────────────────────
  rendering-gate:
    name: Rendering gate (Linux, with tools)
    uses: ./.github/workflows/rendering-linux.yml

  # ── 1. Build the Ubuntu .deb installer ───────────────────────────────
  linux-deb:
    name: Linux .deb (x64)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # so `git describe --tags` works

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache nuget
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-linux-

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            v="${{ github.event.inputs.version }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            v="${GITHUB_REF#refs/tags/}"
            v="${v#v}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF#refs/tags/}"
            v="${v#v}"
          else
            v="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo 0.0.0)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "▶ version: $v"

      # VERIFY, do not regenerate (#1082). This step used to run the generator
      # and ship whatever came out, so the attribution users saw was not the
      # attribution that was reviewed and gated -- it was whatever the NuGet
      # cache produced on the runner that day. Every t0 gate protected a file
      # this step then replaced.
      - name: Verify license manifest matches dependencies
        run: ./scripts/verify-license-manifest.sh

      # Native AOT on Linux shells out to clang and needs zlib headers. Without
      # these, `dotnet publish -p:PublishAot=true` fails inside the linker with a
      # message that does not name the missing package.
      - name: Install Native AOT prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Build .deb (Native AOT)
        run: ./scripts/build-deb.sh --version "${{ steps.ver.outputs.version }}" --arch amd64 --aot --output dist/

      # THE VERIFICATION THAT MAKES SHIPPING AOT HERE DEFENSIBLE.
      #
      # AOT's failure modes are runtime-only — trimmed reflection and native
      # asset loading — so a successful publish proves very little. There is no
      # packaged GUI smoke on Linux (run-packaged-gui-smoke.sh is macOS-only),
      # and a headless runner is a poor place to add one.
      #
      # The CLI is the answer: it needs no display, and `render` exercises the
      # single riskiest thing under AOT — SkiaSharp's native library loading and
      # the font stack — which the GUI shares. If this passes, the component
      # most likely to break under AOT demonstrably works in the shipped binary.
      #
      # This does NOT verify the GUI on Linux. That gap is real and stated.
      - name: Smoke the AOT CLI binary
        run: |
          set -euo pipefail
          cli="artifacts/publish/linux-x64/cli/excise"
          test -x "$cli" || { echo "AOT CLI binary missing at $cli"; exit 1; }
          file "$cli"
          # No managed sidecars is the signature of a real AOT publish; a
          # fallback to the ordinary self-contained build would silently ship
          # a 175MB artifact while this step still passed on `--version`.
          dllcount=$(find artifacts/publish/linux-x64/cli -maxdepth 1 -name '*.dll' | wc -l)
          echo "managed dll sidecars: $dllcount (expect 0 for AOT)"
          test "$dllcount" -eq 0 || { echo "not an AOT publish"; exit 1; }
          "$cli" --version

          # A COMMITTED fixture, deliberately: test-pdfs/ is gitignored except
          # for a handful of checked-in probes, and pointing this at the corpus
          # would silently degrade to "no PDF found" on the runner — leaving the
          # only meaningful part of the smoke unrun while the step still passed.
          pdf="Excise.App.Tests/Resources/sample-pdfs/birth-certificate-request-scrambled.pdf"
          test -f "$pdf" || { echo "smoke fixture missing: $pdf"; exit 1; }

          "$cli" info "$pdf"
          "$cli" text "$pdf" --page 1 | head -3
          # render exercises SkiaSharp native load + the font stack, which is
          # the thing most likely to break under AOT and is shared with the GUI.
          "$cli" render "$pdf" -o /tmp/aot-smoke.png --dpi 72 --ignore-permissions
          bytes=$(stat -c%s /tmp/aot-smoke.png)
          echo "rendered $pdf -> $bytes bytes"
          test "$bytes" -gt 5000 || { echo "render produced a trivial file"; exit 1; }

      - name: Build portable tarball
        # An unpacked, self-contained binary archive for users who don't
        # want a system-wide install. Built from the same publish output
        # the .deb just produced.
        run: |
          set -e
          srcdir="artifacts/publish/linux-x64"
          out="dist/excise-${{ steps.ver.outputs.version }}-linux-x64.tar.gz"
          mkdir -p stage/excise
          cp -a "$srcdir/gui/." stage/excise/
          cp -a "$srcdir/cli/." stage/excise/
          cp README.md LICENSE LICENSES.md stage/excise/ 2>/dev/null || true
          tar -C stage -czf "$out" excise
          rm -rf stage
          ls -lh "$out"

      - name: Compute checksums
        working-directory: dist
        run: |
          for f in *.deb *.tar.gz; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: linux-installer
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  # ── 2. Build the Windows .exe installer (Inno Setup) ────────────────
  windows-exe:
    name: Windows .exe (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache nuget
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-windows-

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $v = "${{ github.event.inputs.version }}" }
          elseif ("${{ github.event_name }}" -eq "release") { $v = "${{ github.ref_name }}" -replace '^v',''  }
          elseif ("${{ github.ref }}".StartsWith("refs/tags/")) { $v = "${{ github.ref_name }}" -replace '^v','' }
          else {
            try { $v = (& git describe --tags --abbrev=0 2>$null).TrimStart('v') } catch { }
            if (-not $v) { $v = "0.0.0" }
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "▶ version: $v"

      - name: Generate license manifest
        shell: pwsh
        run: |
          # Re-use the bash script via Git Bash on the runner (always
          # present on windows-latest). VERIFY, not regenerate (#1082) -- see
          # the Linux step for why.
          & "C:\Program Files\Git\bin\bash.exe" ./scripts/verify-license-manifest.sh

      - name: Build Windows installer
        shell: pwsh
        run: pwsh ./scripts/build-windows-installer.ps1 -Version "${{ steps.ver.outputs.version }}" -OutputDir dist

      - name: Build portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $src = "artifacts\publish\win-x64\gui"
          $stage = "stage\excise"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$src\*" $stage -Recurse -Force
          Copy-Item README.md, LICENSE, LICENSES.md $stage -ErrorAction SilentlyContinue
          $zip = "dist\excise-$v-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path stage\excise -DestinationPath $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$sha  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii "$zip.sha256"
          Get-ChildItem dist | Format-Table

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.exe.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  # ── 3. Build the macOS .app bundle (arm64) ──────────────────────────
  macos-app:
    name: macOS .app (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # so `git describe --tags` works

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache nuget
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-macos-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-macos-

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            v="${{ github.event.inputs.version }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            v="${GITHUB_REF#refs/tags/}"; v="${v#v}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF#refs/tags/}"; v="${v#v}"
          else
            v="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo 0.0.0)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "▶ version: $v"

      - name: Install librsvg (for the .icns icon; best-effort)
        continue-on-error: true
        run: brew install librsvg

      # --aot: Native AOT. Verified on this exact configuration 2026-08-05 —
      # scripts/run-packaged-gui-smoke.sh against the produced bundle passed 8/8
      # automated workflows with zero dyld / DllNotFound / TypeInitialization
      # errors, and first_page_visible in 4ms, which is the SkiaSharp
      # native-asset load #705 exists to check.
      #
      # 55 MB and a single native binary, versus 175 MB and 230 managed .dll
      # sidecars without it. Feature-equivalent: the AOT publish sets
      # EnableScripting=false and IncludeTessdataInApp=false, but both are
      # ALREADY the defaults for any Release build (#341/#342), so the flags
      # restate rather than reduce.
      #
      # Native AOT cannot cross-compile — it invokes the target platform's
      # linker — which is why this is safe here (macos-latest builds the macOS
      # artifact) and why the Windows job cannot simply copy it. AOT publish is
      # slower than a plain one; that cost is paid on the release path only.
      - name: Build macOS .app (arm64, Native AOT)
        run: ./scripts/build-macos-app.sh --version "${{ steps.ver.outputs.version }}" --rid osx-arm64 --aot --output dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  # ── 4. Attach installers to the GitHub release ──────────────────────
  publish:
    name: Attach to GitHub release
    needs: [rendering-gate, linux-deb, windows-exe, macos-app]
    runs-on: ubuntu-latest
    # Only auto-create a release when the trigger was a tag push or a
    # release event. workflow_dispatch reruns just produce artifacts you
    # can download manually from the run page.
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f -exec ls -lh {} +

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          # If the release was just created by `gh release create`, this
          # action attaches files; if it doesn't exist yet (tag-push
          # path), it creates a draft release.
          fail_on_unmatched_files: true
          # Mark rc tags as pre-releases so they don't get the "Latest"
          # badge on the releases page.
          prerelease: ${{ contains(steps.tag.outputs.tag, '-rc') || contains(steps.tag.outputs.tag, '-beta') || contains(steps.tag.outputs.tag, '-alpha') }}
          generate_release_notes: true
          files: |
            artifacts/linux-installer/*
            artifacts/windows-installer/*
            artifacts/macos-app/*
          body: |
            ## Installers

            | Platform        | Installer                                      |
            |-----------------|------------------------------------------------|
            | Ubuntu / Debian | `excise_<version>_amd64.deb`                     |
            | Windows 10/11   | `excise-<version>-win-x64-setup.exe`             |
            | macOS (Apple Silicon) | `excise-<version>-macos-arm64.zip`         |

            Portable archives (`*.tar.gz`, `*.zip`) are also attached
            for users who prefer to extract and run the binary directly.
            Each artifact has a matching `.sha256` checksum file.

            ### Install

            **Ubuntu**
            ```bash
            sudo apt install ./excise_<version>_amd64.deb
            ```

            **Windows**
            Run `excise-<version>-win-x64-setup.exe` and follow the wizard,
            or silently:
            ```powershell
            excise-<version>-win-x64-setup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
            ```

            **macOS (Apple Silicon)**
            Unzip and move `excise.app` to `/Applications`. The bundle is
            **unsigned**, so Gatekeeper quarantines it — open it the first
            time via right-click → Open, or clear the quarantine flag:
            ```bash
            xattr -dr com.apple.quarantine /Applications/excise.app
            ```

            ### Verification

            All packages are self-contained — no .NET 10 runtime needed
            on the target. The installer bundles the GUI editor
            (`Excise.App`) and the `excise` CLI. Third-party license
            notices are visible in **Help → About PDF Editor** and at
            `/usr/share/doc/excise/third-party-licenses.json` (Debian) or
            inside the install directory (Windows).
