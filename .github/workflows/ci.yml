name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

# A new push to a branch/PR cancels its still-running CI run. Without this, a
# burst of pushes stacks full 4-job runs that saturate the runner pool and crawl
# for over an hour on contention (observed 2026-08-25 — four pushes in ~50 min
# left every run's Excise.Core.Tests step "in_progress" for 90+ min, though it
# passes locally in ~80s). Standard practice; only the newest run per ref runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  # ReactiveUI/Splat's author signing certificate was revoked upstream,
  # so a fresh `dotnet restore` fails with NU3012 (revoked cert) for
  # packages that are otherwise the correct published versions. Skip NuGet
  # signature verification in CI so a third-party cert revocation can't
  # block the build. Tracked alongside the ReactiveUI removal in #343.
  DOTNET_NUGET_SIGNATURE_VERIFICATION: false

jobs:
  # ── 1. Linux: full T1 gate, plus the Linux-only release-adjacent gates
  #        (coverage, pdf20 conformance, benchmark suite) that don't yet
  #        have a portable equivalent worth tripling the runner cost for.
  #        See #646 for the T0-T3 tier definitions this job targets. ──────
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Detect whether GUI-relevant code changed. The headless Excise.App.Tests
      # suite is slow and Avalonia-dispatcher-sensitive; there's no need to run
      # it for library-only changes (e.g. a Excise.Core-only PR). It still always
      # runs on pushes to develop (the default branch) as a post-merge
      # integration safety net; main is only a release pointer.
      #
      # Only the Linux job honours this conditional: macOS and Windows always
      # run Excise.App.Tests unconditionally (see those jobs below) because
      # #612's MacNativeMenuBuilder regression was itself platform-specific
      # and not a GUI-code-path change that this filter would have caught.
      - name: Detect changed areas
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            gui:
              - 'Excise.App/**'
              - 'Excise.App.Tests/**'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false

      - name: Cache nuget
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-linux-

      - name: Set up Java (for veraPDF)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install veraPDF
        # veraPDF drives the PDF/UA-1 conformance gate (PdfUaConformanceTests,
        # #413) and the corpus tests. The UA test skips gracefully if veraPDF is
        # absent, so a download/installer outage must not fail the whole job —
        # keep the install best-effort. (The old pinned 1.28.1 URL 404'd; use the
        # versionless latest installer.)
        continue-on-error: true
        run: |
          set -uo pipefail
          # Download veraPDF. curl -f fails on HTTP errors (so we never unzip an
          # error page), with retries for transient flakiness.
          curl -fSL --retry 3 --connect-timeout 30 \
            https://software.verapdf.org/releases/verapdf-installer.zip \
            -o /tmp/verapdf.zip \
            || { echo "::warning::veraPDF download failed; skipping veraPDF setup"; exit 0; }
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf-installer \
            || { echo "::warning::veraPDF archive invalid; skipping veraPDF setup"; exit 0; }

          # Create installation response file for silent install.
          # Unquoted heredoc so $HOME expands (izpack doesn't expand env vars; a
          # quoted heredoc would create a literal "$HOME/verapdf" directory).
          cat > /tmp/auto-install.xml << EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
              <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
              <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
                  <installpath>$HOME/verapdf</installpath>
              </com.izforge.izpack.panels.target.TargetPanel>
              <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
                  <pack index="0" name="veraPDF GUI" selected="false"/>
                  <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
                  <pack index="2" name="veraPDF Validation model" selected="true"/>
                  <pack index="3" name="veraPDF Documentation" selected="false"/>
                  <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
              </com.izforge.izpack.panels.packs.PacksPanel>
              <com.izforge.izpack.panels.install.InstallPanel id="install"/>
              <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF

          # Find and run installer
          cd /tmp/verapdf-installer
          INSTALLER=$(find . \( -name "verapdf-izpack-installer-*.jar" -o -name "verapdf-greenfield-*.jar" -o -name "verapdf-*installer*.jar" \) | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "::warning::veraPDF installer jar not found; skipping veraPDF setup"
            exit 0
          fi
          java -jar "$INSTALLER" /tmp/auto-install.xml || \
            { echo "::warning::veraPDF install failed; continuing without it"; exit 0; }

          # Verify installation (non-fatal)
          ~/verapdf/verapdf --version || true

      - name: Install xvfb for headless UI tests
        # Unconditional (was gated on the gui paths-filter): the always-run
        # Excise.Avalonia.Tests step below also needs xvfb since the #631
        # HeadlessUnitTestSession accessibility tests joined it (#752).
        run: sudo apt-get install -y xvfb

      - name: Install pdfcpu validator
        run: |
          GOBIN="$HOME/go/bin" go install github.com/pdfcpu/pdfcpu/cmd/pdfcpu@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/pdfcpu" version

      - name: Install smoke rendering oracles for skip-budget coverage
        run: |
          # --require-all (#967): on CI a rotted "latest" URL must be a loud
          # red naming the URL, not a silently smaller corpus that shifts
          # [Theory] row counts under the skip-budget gate.
          scripts/download-smoke-corpus.sh --require-all
          scripts/download-pdfbox.sh
          scripts/download-pdfium.sh

      - name: Restore packages
        run: dotnet restore

      - name: Verify TRUE Redaction Implementation
        run: ./scripts/verify-true-redaction.sh

      - name: Verify PDF capability registry and scorecard
        run: ./scripts/check-pdf-capability-registry.sh

      # Gate asymmetry (#618): CORRECTNESS is a blocking gate, PERFORMANCE is a
      # budget. A perf regression may never be resolved by weakening a correctness
      # assertion. This fails a PR that touches a perf-sensitive path AND rewrites
      # the expected values of a test, unless the commit explicitly says
      # "Correctness-Expectations-Changed: <why>".
      #
      # It is not hypothetical: 8a8e661 changed the tile quantization constants and,
      # in the same commit, rewrote ContinuousDpiTests' expected values. Legitimate
      # edit, unacceptable mechanism — nothing signalled that an optimization had
      # just redefined "correct".
      - name: Gate asymmetry (correctness cannot be weakened by perf)
        run: ./scripts/check-gate-asymmetry.sh origin/${{ github.base_ref || 'develop' }}

      - name: Build (Debug)
        run: dotnet build excise.sln -c Debug

      - name: Verify coherent architecture artifact set
        run: |
          ./scripts/check-architecture-artifacts.sh --self-test
          ./scripts/check-architecture-artifacts.sh

      - name: Run Excise.Core.Tests with coverage
        run: |
          dotnet test Excise.Core.Tests --no-build -c Debug \
            --collect:"XPlat Code Coverage" \
            --results-directory coverage/ \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=core.trx" \
            --verbosity normal

      # Skip budget (#619): a test that silently stops running is coverage loss you
      # cannot see. A security-relevant assertion
      # (HiddenTextToggles_DoNotLoadOcrAssemblyBeforeRasterizedScan) quietly stopped
      # executing when unrelated tests were added to its class, and the suite stayed
      # green. Fails when the skip set CHANGES in either direction.
      #
      # Skip-budget REMOVED from Linux CI. The allowlist is environment-
      # conditioned for a corpus-less runner (#854), but it drifts, and a
      # macOS-only maintainer cannot enumerate the Linux runner's skip set to
      # re-sync it — so it failed continuously on bookkeeping, not on a real
      # skipped-test regression. Skip-rot is policed on the dev machine by
      # `scripts/test-tier.sh t1`. (The tests themselves still RUN above; only
      # the skip-count bookkeeping gate is dropped here.)

      # Test count (#894): the skip budget above catches a test that stops
      # running LOUDLY (it reports as skipped). This catches one that stops
      # running SILENTLY — discovered, then absent from the results entirely:
      # not passed, not failed, not skipped, just gone.
      #
      # Measured on Excise.Core.Tests: 3932 discovered, ~half of all runs report
      # 3931, a different test each time. Not xunit parallelism — forcing
      # parallelizeTestCollections=false and maxParallelThreads=1 changes the
      # wall clock by 4s and still loses one.
      #
      # This matters more than a normal flake because it defeats the repo's own
      # method: mutation testing proves an assertion discriminates by reverting
      # the fix and confirming red, and a case that never reports cannot go red.
      # The gate re-runs whatever went missing — a transient loss is reported,
      # a test that genuinely never executes is fatal. Reuses the trx above.
      - name: Test count (Excise.Core.Tests)
        run: ./scripts/check-test-count.sh Excise.Core.Tests/Excise.Core.Tests.csproj --trx coverage/core.trx

      - name: Install reportgenerator
        run: mkdir -p tools && dotnet tool install --tool-path ./tools dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          ./tools/reportgenerator \
            -reports:coverage/*/coverage.cobertura.xml \
            -targetdir:coverage/report \
            -reporttypes:Cobertura

      - name: Coverage Gate (Excise.Core >= 93%)
        # Restored to the 93% ratchet (#603) — the branch had drifted to
        # 89.78% not because coverage was genuinely hard to reach, but
        # because six test files hard-coded a Linux-only system font path
        # (/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf) and silently
        # skipped on every macOS/Windows dev machine (a real instance of the
        # #619 "invisible coverage loss" pattern, just not one the skip-
        # budget gate happened to be watching). Fixed by bundling the fonts
        # as embedded test resources (Excise.Core.Tests/Fixtures/Fonts/,
        # NOTICE.md) instead of depending on system fonts, plus focused
        # tests for the previously-untested PdfIccProfile matrix/lut16 paths.
        # Measured 93.01% locally after the fix — keep this at exactly 93%,
        # not padded, so the next real regression still trips the gate.
        #
        # reportgenerator's Cobertura output is named Cobertura.xml (not
        # coverage.cobertura.xml — that's coverlet's raw collector name).
        run: scripts/check-coverage.sh coverage/report/Cobertura.xml 0.93 Excise.Core

      - name: Run Excise.Cli.Tests
        run: |
          dotnet test Excise.Cli.Tests --no-build -c Debug \
            --logger "console;verbosity=normal"

      - name: Run Excise.Avalonia.Tests
        # Lightweight, non-GUI tests for the viewer libraries (API gates, pure
        # logic). Deliberately separate from the heavy, flaky headless
        # Excise.App.Tests suite so viewer-library changes get reliable coverage
        # on every PR. (#363, #384)
        #
        # xvfb-run (#752): the #631 accessibility tests drive a real
        # HeadlessUnitTestSession app lifecycle, which crashed the test host on
        # the displayless Linux runner (killing the whole assembly with no
        # captured output). Same precedent as the Excise.App.Tests step below.
        #
        # TRX tolerance, Linux-only (#752): with xvfb + HeadlessSessionGuard the
        # suite runs fully green here (62/62 on PR #764), but the test host
        # still exits 1 on native teardown — Avalonia/SkiaSharp headless
        # cleanup segfaults on process shutdown AFTER every test has passed,
        # and the guard cannot intercept a native crash. The helper script
        # runs the suite with a TRX logger and, on a non-zero exit, passes
        # only if the TRX positively confirms >0 passed and 0 failed — a
        # genuinely failing test still fails this step. It self-tests that
        # verdict logic against synthetic green/failed TRX fixtures on every
        # run before trusting it. macOS and Windows exit cleanly and keep the
        # strict raw exit code.
        run: |
          xvfb-run -a scripts/run-avalonia-tests-linux.sh
        env:
          AVALONIA_TEST_COLLECT_COVERAGE: '1'
          AVALONIA_TEST_RESULTS_DIR: ${{ github.workspace }}/coverage-avalonia

      # Coverage floors moved to the RELEASE path (#1171). The `ci`-profile
      # per-assembly floors (Avalonia, Rendering, Ocr, App) are enforced in
      # .github/workflows/release.yml's `coverage-floors` job — a corpus-less
      # ubuntu runner that matches the profile these floors were calibrated for
      # (see tests/coverage-floors.tsv) — not on every push. This Linux job
      # still COLLECTS coverage (the steps below) and uploads it as an artifact;
      # only the floor ENFORCEMENT relocated, so a macOS-only maintainer is not
      # blocked by a gate calibrated for a runner only that runner reaches.

      - name: Run Excise.Rendering.Tests (deterministic only)
        run: |
          # The PR gate runs only environment-independent rendering tests
          # (root SkiaRenderer "renders without error", string-escape, Fonts
          # table parsing). The following are environment-sensitive and should
          # be run locally with scripts/run-visual-regression-local.sh before a
          # release candidate, not on paid GitHub-hosted runners:
          # - Corpus: too slow.
          # - Differential: compares against the external `mutool` binary +
          #   sample PDFs absent in CI → empty [Theory] → "No data found".
          # - Benchmark: timing/allocation thresholds that flake under the
          #   full parallel suite (pass in isolation).
          # - Visual: pixel-baseline comparisons that differ with CI's fonts /
          #   Skia/freetype build.
          dotnet test Excise.Rendering.Tests --no-build -c Debug \
            --filter "FullyQualifiedName!~Corpus&FullyQualifiedName!~Differential&FullyQualifiedName!~Benchmark&FullyQualifiedName!~Visual" \
            --collect:"XPlat Code Coverage" \
            --results-directory coverage-rendering/ \
            --logger "console;verbosity=normal"

      # (Excise.Rendering `ci` coverage floor enforced on the release path; #1171.)

      # Skip budget (#619, #655): Excise.Rendering.Tests has ~114
      # Assert.SkipWhen/SkipUnless call sites and had no gate watching them —
      # only Excise.Core.Tests was covered. Can't reuse the "deterministic
      # only" run's trx above: that step deliberately excludes Corpus/
      # Differential/Benchmark/Visual (see its own comment), which is most of
      # the skip population, so its trx would silently omit them from the
      # budget. Runs the project standalone instead. This is NOT the
      # double-the-CI-bill problem check-skip-budget.sh's own header warns
      # about: this runner has only the smoke corpus plus PDFBox/PDFium
      # provisioned for #935; it still lacks the larger gitignored corpora
      # (/isartor, /local-real-world, ...) and mutool/ghostscript/pdftocairo/
      # tesseract, so the remaining environment-gated sites return quickly.
      # Skip-budget (Excise.Rendering.Tests) REMOVED from Linux CI — same reason
      # as the Core skip-budget above: unmaintainable bookkeeping on a corpus-
      # less runner from a macOS-only setup. Policed locally via t1.

      - name: PDF 2.0 Renderer Conformance Gate
        run: scripts/run-pdf20-renderer-conformance.sh --run-tests

      - name: Run Performance Benchmark Tests (informational)
        # Allocation/timing thresholds are environment-sensitive; run them for
        # visibility but don't fail the gate. Release candidates should run the
        # local long/visual suites on a known developer machine.
        run: |
          dotnet test Excise.Rendering.Tests --no-build -c Debug \
            --filter "FullyQualifiedName~PerformanceBenchmark|FullyQualifiedName~MemoryBenchmark" \
            --logger "console;verbosity=normal" || true

      - name: Run Benchmark Suite Regression Gate
        # Deterministic synthetic benchmark gate for #344/#357. The no-oracle
        # mode keeps CI independent of MuPDF/Poppler/Ghostscript availability
        # while still failing on excise parser/render/redaction regressions and
        # verifying the benchmark report contract.
        run: |
          CONFIG=Debug scripts/run-benchmarks.sh suite \
            --oracles none \
            --page-limit 1 \
            --output-dir logs/ci-benchmark-suite \
            --include-cli-render \
            --fail-on-regression

      - name: Performance budget check (warn-only; #602)
        # Focused workflow perf budgets (scripts/check-perf-budgets.sh vs
        # tests/perf-budgets/workflow-budgets.json). WARN-ONLY here by design:
        # shared runners are far too wall-time-variable for a blocking perf
        # gate, and this runner has no smoke corpus (see the note above), so
        # the script SKIPs cleanly. Hard enforcement is local
        # (scripts/check-perf-budgets.sh, default --mode fail) and in
        # release-smoke's perf-budget gate on a known developer machine.
        # A perf budget breach is a performance signal, never a correctness
        # failure - it must not block a PR from a noisy runner.
        run: scripts/check-perf-budgets.sh --mode warn || true

      - name: Run Excise.Ocr.Tests
        run: |
          dotnet test Excise.Ocr.Tests --no-build -c Debug \
            --collect:"XPlat Code Coverage" \
            --results-directory coverage-ocr/ \
            --logger "console;verbosity=normal" || true

      # (Excise.Ocr `ci` coverage floor enforced on the release path; #1171.)

      - name: Run Excise.App.Tests (headless with xvfb)
        # Skipped for library-only changes (see "Detect changed areas"); always
        # runs on main. Library changes that affect the GUI are caught by the
        # main run before any release is cut.
        #
        # Runs the FULL suite, including the *_MatchesBaseline visual tests. The
        # chronic #363 "host process exited unexpectedly" crash was root-caused
        # to xunit's default collection parallelism racing SkiaSharp's
        # process-wide native font manager (the GUI tests render with real Skia,
        # UseHeadlessDrawing=false). The suite is now serialized via
        # [assembly: CollectionBehavior(DisableTestParallelization = true)] in
        # Excise.App.Tests/AssemblyInfo.cs, which eliminates the concurrent native
        # font access; the full suite (incl. *_MatchesBaseline) was validated
        # crash-free across repeated runs. The earlier *_MatchesBaseline
        # exclusion (a workaround) is therefore removed.
        if: steps.changes.outputs.gui == 'true' || github.ref == 'refs/heads/develop'
        run: |
          xvfb-run -a dotnet test Excise.App.Tests --no-build -c Debug \
            --collect:"XPlat Code Coverage" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=excise-app.trx" \
            --results-directory Excise.App.Tests/TestResults \
            --blame-hang-timeout 120000

      # (Excise.App `ci` coverage floor enforced on the release path; #1171.
      #  On a tag build release.yml runs App.Tests unconditionally, so the
      #  library-only gui-conditional that complicated this gate here does not
      #  apply there.)

      # Skip budget (#619, #655): tests/skip-allowlist/Excise.App.Tests.txt
      # already existed (from earlier ad-hoc bookkeeping) but nothing ever
      # invoked check-skip-budget.sh against it — dead weight, not an
      # enforced gate. Same condition as the run above: this step reads that
      # run's trx (Excise.App.Tests is the full, unfiltered, serial ~17-minute
      # suite — reusing its trx instead of a second run is the same
      # "don't double the CI bill" reasoning as the Excise.Core.Tests step),
      # so it must not run on a job where the suite above didn't.
      # Skip budget (Excise.App.Tests) moved off per-push CI (#1171) — still
      # enforced locally by scripts/test-tier.sh t1 (skip-budget-app), same as
      # the Core/Rendering skip-budgets.
      - name: Skip budget (Excise.App.Tests)
        run: echo "Excise.App.Tests skip-budget moved off per-push CI (#1171); enforced in local t1"

      - name: Upload coverage report as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report/
          retention-days: 30

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: |
            **/TestResults/
            **/*.trx
          retention-days: 7

  # ── 2. macOS: T1 gate, always including Excise.App.Tests unconditionally.
  #        #647 exists because #612 (a MacNativeMenuBuilder checkmark-state
  #        regression) shipped silently — no CI job ran on macOS at all, so
  #        the GUI-changed-files conditional the Linux job uses is
  #        deliberately NOT applied here: any change, GUI-labelled or not,
  #        could regress native macOS menu behaviour. ─────────────────────
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache nuget
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-macos-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-macos-

      - name: Set up Java (for veraPDF)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install veraPDF
        # Same izpack installer as Linux; the jar is cross-platform and Java
        # is already set up above. Best-effort — see the Linux job's install
        # step for the full rationale.
        continue-on-error: true
        run: |
          set -uo pipefail
          curl -fSL --retry 3 --connect-timeout 30 \
            https://software.verapdf.org/releases/verapdf-installer.zip \
            -o /tmp/verapdf.zip \
            || { echo "::warning::veraPDF download failed; skipping veraPDF setup"; exit 0; }
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf-installer \
            || { echo "::warning::veraPDF archive invalid; skipping veraPDF setup"; exit 0; }

          cat > /tmp/auto-install.xml << EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
              <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
              <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
                  <installpath>$HOME/verapdf</installpath>
              </com.izforge.izpack.panels.target.TargetPanel>
              <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
                  <pack index="0" name="veraPDF GUI" selected="false"/>
                  <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
                  <pack index="2" name="veraPDF Validation model" selected="true"/>
                  <pack index="3" name="veraPDF Documentation" selected="false"/>
                  <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
              </com.izforge.izpack.panels.packs.PacksPanel>
              <com.izforge.izpack.panels.install.InstallPanel id="install"/>
              <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF

          cd /tmp/verapdf-installer
          INSTALLER=$(find . \( -name "verapdf-izpack-installer-*.jar" -o -name "verapdf-greenfield-*.jar" -o -name "verapdf-*installer*.jar" \) | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "::warning::veraPDF installer jar not found; skipping veraPDF setup"
            exit 0
          fi
          java -jar "$INSTALLER" /tmp/auto-install.xml || \
            { echo "::warning::veraPDF install failed; continuing without it"; exit 0; }

          ~/verapdf/verapdf --version || true

      - name: Restore packages
        run: dotnet restore

      - name: Verify TRUE Redaction Implementation
        run: ./scripts/verify-true-redaction.sh

      - name: Gate asymmetry (correctness cannot be weakened by perf)
        run: ./scripts/check-gate-asymmetry.sh origin/${{ github.base_ref || 'develop' }}

      - name: Build (Debug)
        run: dotnet build excise.sln -c Debug

      - name: Run Excise.Core.Tests
        # No coverage collection here — the coverage gate is Linux-only
        # (one definition, avoids threshold drift between platforms); font
        # fixtures are embedded resources (#603) so this needs no system
        # font install to pass identically to Linux.
        run: |
          dotnet test Excise.Core.Tests --no-build -c Debug \
            --logger "console;verbosity=normal"

      - name: Run Excise.Cli.Tests
        run: |
          dotnet test Excise.Cli.Tests --no-build -c Debug \
            --logger "console;verbosity=normal"

      - name: Run Excise.Avalonia.Tests
        run: |
          dotnet test Excise.Avalonia.Tests --no-build -c Debug \
            --logger "console;verbosity=normal"

      - name: Run Excise.Rendering.Tests (deterministic only)
        # Same filter rationale as the Linux job — see that job's comment.
        run: |
          dotnet test Excise.Rendering.Tests --no-build -c Debug \
            --filter "FullyQualifiedName!~Corpus&FullyQualifiedName!~Differential&FullyQualifiedName!~Benchmark&FullyQualifiedName!~Visual" \
            --logger "console;verbosity=normal"

      - name: Run Excise.App.Tests
        # Unconditional (see job comment) and no xvfb wrapper: Avalonia's
        # headless platform (UseHeadless, UseHeadlessDrawing=false in
        # Excise.App.Tests/UI/TestAppBuilder.cs) renders through real Skia
        # without needing an X server, so it needs no display-server shim on
        # macOS. *_MatchesBaseline visual-pixel tests are excluded: they're
        # calibrated to Linux CI's specific Skia/freetype/font build, exactly
        # as noted for the equivalent Linux exclusions elsewhere in this file.
        run: |
          dotnet test Excise.App.Tests --no-build -c Debug \
            --filter "FullyQualifiedName!~MatchesBaseline" \
            --logger "console;verbosity=normal" \
            --blame-hang-timeout 120000

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: |
            **/TestResults/
            **/*.trx
          retention-days: 7

  # ── 3. Windows: T1 gate, always including Excise.App.Tests unconditionally
  #        (same rationale as macOS above). Default shell is pwsh, matching
  #        release.yml's windows-exe job; bash scripts are invoked through
  #        Git Bash (always present on windows-latest) rather than ported to
  #        PowerShell, so there is exactly one implementation of each gate
  #        script instead of a shell-specific fork. ──────────────────────
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache nuget
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-windows-

      - name: Set up Java (for veraPDF)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install veraPDF
        # Best-effort. Runs under Git Bash directly because the previous
        # pwsh-wrapped variant was not valid: pwsh expanded \$(find ...) as its
        # own subexpression. izpack gets a Windows-style install path
        # ($USERPROFILE); git-bash's /c/... $HOME is not a valid Java path.
        # Windows installs a verapdf.bat launcher; the *nix script may be
        # absent, so verification accepts either.
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          curl -fSL --retry 3 --connect-timeout 30 \
            https://software.verapdf.org/releases/verapdf-installer.zip \
            -o /tmp/verapdf.zip \
            || { echo "::warning::veraPDF download failed; skipping veraPDF setup"; exit 0; }
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf-installer \
            || { echo "::warning::veraPDF archive invalid; skipping veraPDF setup"; exit 0; }

          cat > /tmp/auto-install.xml << EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
              <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
              <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
                  <installpath>$USERPROFILE/verapdf</installpath>
              </com.izforge.izpack.panels.target.TargetPanel>
              <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
                  <pack index="0" name="veraPDF GUI" selected="false"/>
                  <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
                  <pack index="2" name="veraPDF Validation model" selected="true"/>
                  <pack index="3" name="veraPDF Documentation" selected="false"/>
                  <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
              </com.izforge.izpack.panels.packs.PacksPanel>
              <com.izforge.izpack.panels.install.InstallPanel id="install"/>
              <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF

          cd /tmp/verapdf-installer
          INSTALLER=$(find . \( -name "verapdf-izpack-installer-*.jar" -o -name "verapdf-greenfield-*.jar" -o -name "verapdf-*installer*.jar" \) | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "::warning::veraPDF installer jar not found; skipping veraPDF setup"
            exit 0
          fi
          java -jar "$INSTALLER" /tmp/auto-install.xml || \
            { echo "::warning::veraPDF install failed; continuing without it"; exit 0; }

          # Verify installation (non-fatal).
          if [ -f "$USERPROFILE/verapdf/verapdf.bat" ]; then
            "$USERPROFILE/verapdf/verapdf.bat" --version || true
          else
            "$USERPROFILE/verapdf/verapdf" --version || true
          fi

      - name: Restore packages
        run: dotnet restore

      - name: Verify TRUE Redaction Implementation
        shell: pwsh
        run: |
          & "C:\Program Files\Git\bin\bash.exe" ./scripts/verify-true-redaction.sh

      - name: Gate asymmetry (correctness cannot be weakened by perf)
        shell: pwsh
        run: |
          & "C:\Program Files\Git\bin\bash.exe" ./scripts/check-gate-asymmetry.sh "origin/${{ github.base_ref || 'develop' }}"

      - name: Build (Debug)
        run: dotnet build excise.sln -c Debug

      - name: Run Excise.Core.Tests
        # No coverage collection — see the macOS job's identical note.
        run: |
          dotnet test Excise.Core.Tests --no-build -c Debug `
            --logger "console;verbosity=normal"

      - name: Run Excise.Cli.Tests
        run: |
          dotnet test Excise.Cli.Tests --no-build -c Debug `
            --logger "console;verbosity=normal"

      - name: Run Excise.Avalonia.Tests
        run: |
          dotnet test Excise.Avalonia.Tests --no-build -c Debug `
            --logger "console;verbosity=normal"

      - name: Run Excise.Rendering.Tests (deterministic only)
        # Same filter rationale as the Linux job — see that job's comment.
        run: |
          dotnet test Excise.Rendering.Tests --no-build -c Debug `
            --filter "FullyQualifiedName!~Corpus&FullyQualifiedName!~Differential&FullyQualifiedName!~Benchmark&FullyQualifiedName!~Visual" `
            --logger "console;verbosity=normal"

      - name: Run Excise.App.Tests
        # Unconditional, no display-server shim needed — same rationale as
        # the macOS job's identical step. *_MatchesBaseline excluded for the
        # same Linux-Skia-baseline reason.
        run: |
          dotnet test Excise.App.Tests --no-build -c Debug `
            --filter "FullyQualifiedName!~MatchesBaseline" `
            --logger "console;verbosity=normal" `
            --blame-hang-timeout 120000

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: |
            **/TestResults/
            **/*.trx
          retention-days: 7

  # ── Native AOT release lane (#590) ───────────────────────────────────────
  #    Publishes Excise.App with NativeAOT and packages the macOS .app, so an
  #    AOT-compile regression fails CI. First-party Excise.* code is AOT-clean
  #    (source-gen JSON, no reflection-based ReactiveUI WhenAnyValue); the only
  #    remaining warnings are third-party GUI-framework roll-ups, suppressed in
  #    Excise.App.csproj and tracked in #593. Runtime GUI validation is covered
  #    by scripts/run-aot-smoke.sh --gui-smoke locally / release-smoke --aot.
  #    osx-arm64 is validated; other RIDs are #595.
  aot-macos:
    name: Native AOT (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache nuget
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-macos-aot-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-macos-aot-

      - name: AOT publish + macOS .app package
        run: scripts/run-aot-smoke.sh --output logs/aot-ci

      - name: Upload AOT evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: aot-evidence
          path: logs/aot-ci/
          retention-days: 7

  # ── The Linux rendering-differential job was REMOVED from the push/PR gate.
  #    It compared excise's SkiaSharp raster against reference tools with tight
  #    pixel tolerances. SkiaSharp on Linux (freetype/fontconfig) rasterises a
  #    few units differently from macOS (CoreText), so those differentials
  #    failed continuously — they measure SkiaSharp's platform behaviour, not
  #    excise. A macOS-only maintainer cannot baseline Linux rendering, so the
  #    job was permanently red and therefore ignored, which is how a real
  #    regression would hide.
  #
  #    This also makes the per-push jobs CONSISTENT: the Linux, macOS AND
  #    Windows test jobs all already run Excise.Rendering.Tests with
  #    `!~Differential&!~Corpus&!~Benchmark&!~Visual` (see those steps). The
  #    differentials were only ever run per-push HERE, on Linux, which is why
  #    this was the lone red. They still run where they're meant to: in
  #    release.yml (which `uses:` rendering-linux.yml before publish) and on
  #    the dev machine via scripts/run-visual-regression-local.sh. Per-push CI
  #    now runs the platform-AGNOSTIC logic everywhere, where a failure is a
  #    real, actionable signal.
